name: Publish Portfolio KIPP

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Siapkan Quarto dan dependensi PDF
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render dan publish portfolio
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
